version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
  exclusions:
    rules:
      # Test HTTP clients and deferred Close() calls; context plumbing and
      # Close errors add noise there without catching anything.
      - path: _test\.go
        linters: [noctx, errcheck]
      - path: _test\.go
        text: "G104"
        linters: [gosec]
formatters:
  enable:
    - gofmt
    - goimports
