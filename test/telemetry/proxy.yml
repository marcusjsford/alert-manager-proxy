upstream:
  url: http://alertmanager:9093
shutdown_timeout: 3s
telemetry:
  enabled: true
  instance_id: am-off
  export_timeout: 500ms
  batch_interval: 200ms
  metric_interval: 1s
clients:
  rules:
    - name: legacy-prometheus
      user_agent: '^Prometheus/'
    - name: lab-smoke
      user_agent: '^AmpSmoke/'
    - name: lab-benchmark
      user_agent: '^AmpBench/'
    - name: fanout-full
      user_agent: '^FanoutFull/'
    - name: fanout-two
      user_agent: '^FanoutTwo/'
    - name: fanout-one
      user_agent: '^FanoutOne/'
    - name: dashboard
      basic_auth_user: grafana
    - name: script
      header: X-Client-Name
      header_value: lab-script
redaction:
  headers: [Authorization, X-Lab-Secret]
  silence_comment: true
  silence_created_by: true
