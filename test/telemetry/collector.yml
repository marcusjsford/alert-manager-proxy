extensions:
  health_check:
    endpoint: 0.0.0.0:13133
receivers:
  otlp:
    protocols:
      grpc: {endpoint: "0.0.0.0:4317"}
      http: {endpoint: "0.0.0.0:4318"}
processors:
  batch:
    timeout: 200ms
    send_batch_size: 64
exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000
    database: otel
    username: amp
    password: amp-lab-only
    create_schema: true
    ttl: 24h
    timeout: 2s
    retry_on_failure: {enabled: false}
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse]
