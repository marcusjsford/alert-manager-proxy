global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/rules.yml]
alerting:
  alertmanagers:
    # The independent reference proves this binary actually sends API v1.
    - api_version: v1
      static_configs:
        - targets: [am-v026:9093]
    # Normal three-way client fanout; story 040 translates POST /api/v1/alerts.
    - api_version: v1
      static_configs:
        - targets: [proxy-1:9095, proxy-2:9095, proxy-3:9095]
scrape_configs:
  - job_name: self
    static_configs:
      - targets: [localhost:9090]
  # Test-only gauge used by the lab to make a rule fire and then resolve.
  - job_name: lab-probe
    scrape_interval: 2s
    static_configs:
      - targets: [receiver:8080]
