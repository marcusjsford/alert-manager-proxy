name: CI

# Stage 1: build + unit tests, lint, and the strict contract plus
#          pass-through/inspection matrix against production, the selected
#          upgrade target and the latest upstream Alertmanager release.
#          Runs on every push and PR. Same checks as `make ci`.
# Stage 2: docker build, gated on stage 1.
#
# No actions/checkout: it is a JS action needing Node.js in the job container,
# which these images don't ship. A plain `git clone` from the internal Forgejo
# hostname instead (same approach as code-indexer's pipeline, which shares
# this act_runner and its compose network).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: docker
    container:
      image: golang:1.26
    steps:
      - run: git clone --quiet "http://x-access-token:${{ secrets.GITHUB_TOKEN }}@forgejo:3000/${{ github.repository }}.git" "$GITHUB_WORKSPACE" && git -C "$GITHUB_WORKSPACE" checkout --quiet ${{ github.sha }}
      - run: go build ./...
        working-directory: ${{ github.workspace }}
      - run: go vet ./...
        working-directory: ${{ github.workspace }}
      - run: go test -race ./...
        working-directory: ${{ github.workspace }}

  lint:
    runs-on: docker
    container:
      image: golangci/golangci-lint:v2.14.0
    steps:
      - run: git clone --quiet "http://x-access-token:${{ secrets.GITHUB_TOKEN }}@forgejo:3000/${{ github.repository }}.git" "$GITHUB_WORKSPACE" && git -C "$GITHUB_WORKSPACE" checkout --quiet ${{ github.sha }}
      - run: golangci-lint run ./...
        working-directory: ${{ github.workspace }}

  # Strict v1 contract plus pass-through/inspection tests for one Alertmanager
  # version, driven by test/release/check-version.sh. Production and the
  # selected upgrade target are pinned; the latest upstream release is
  # discovered on every push so a new release cannot silently break the proxy.
  compat-production:
    runs-on: docker
    container:
      image: golang:1.26
    env:
      AM_VERSION: "0.26.0"
    steps:
      - run: git clone --quiet "http://x-access-token:${{ secrets.GITHUB_TOKEN }}@forgejo:3000/${{ github.repository }}.git" "$GITHUB_WORKSPACE" && git -C "$GITHUB_WORKSPACE" checkout --quiet ${{ github.sha }}
      - run: test/release/check-version.sh "$AM_VERSION"
        working-directory: ${{ github.workspace }}

  compat-target:
    runs-on: docker
    container:
      image: golang:1.26
    env:
      AM_VERSION: "0.34.1"
    steps:
      - run: git clone --quiet "http://x-access-token:${{ secrets.GITHUB_TOKEN }}@forgejo:3000/${{ github.repository }}.git" "$GITHUB_WORKSPACE" && git -C "$GITHUB_WORKSPACE" checkout --quiet ${{ github.sha }}
      - run: test/release/check-version.sh "$AM_VERSION"
        working-directory: ${{ github.workspace }}

  compat-latest:
    runs-on: docker
    container:
      image: golang:1.26
    steps:
      - run: git clone --quiet "http://x-access-token:${{ secrets.GITHUB_TOKEN }}@forgejo:3000/${{ github.repository }}.git" "$GITHUB_WORKSPACE" && git -C "$GITHUB_WORKSPACE" checkout --quiet ${{ github.sha }}
      - run: |
          version="$(test/release/latest-version.sh)"
          echo "latest upstream Alertmanager: v$version"
          test/release/check-version.sh "$version"
        working-directory: ${{ github.workspace }}

  docker-build:
    needs: [build-test, lint, compat-production, compat-target, compat-latest]
    runs-on: docker
    container:
      image: docker:27-cli
    steps:
      - run: apk add --no-cache git
      - run: git clone --quiet "http://x-access-token:${{ secrets.GITHUB_TOKEN }}@forgejo:3000/${{ github.repository }}.git" "$GITHUB_WORKSPACE" && git -C "$GITHUB_WORKSPACE" checkout --quiet ${{ github.sha }}
      - run: docker build --build-arg VERSION=${{ github.sha }} -t alertmanager-proxy:ci-${{ github.sha }} .
        working-directory: ${{ github.workspace }}
