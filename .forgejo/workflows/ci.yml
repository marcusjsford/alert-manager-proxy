name: CI

# Stage 1: build + unit tests, lint, pass-through integration against a real
#          Alertmanager (as a job service), and the v1 contract harness.
#          Runs on every push and PR. Same checks as `make ci`.
# Stage 2: docker build, gated on stage 1.
#
# No actions/checkout: it is a JS action needing Node.js in the job container,
# which these images don't ship. A plain `git clone` from the internal Forgejo
# hostname instead (same approach as code-indexer's pipeline, which shares
# this act_runner and its compose network).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: docker
    container:
      image: golang:1.26
    steps:
      - run: git clone --quiet "http://x-access-token:${{ secrets.GITHUB_TOKEN }}@forgejo:3000/${{ github.repository }}.git" "$GITHUB_WORKSPACE" && git -C "$GITHUB_WORKSPACE" checkout --quiet ${{ github.sha }}
      - run: go build ./...
        working-directory: ${{ github.workspace }}
      - run: go vet ./...
        working-directory: ${{ github.workspace }}
      - run: go test -race ./...
        working-directory: ${{ github.workspace }}

  lint:
    runs-on: docker
    container:
      image: golangci/golangci-lint:v2.14.0
    steps:
      - run: git clone --quiet "http://x-access-token:${{ secrets.GITHUB_TOKEN }}@forgejo:3000/${{ github.repository }}.git" "$GITHUB_WORKSPACE" && git -C "$GITHUB_WORKSPACE" checkout --quiet ${{ github.sha }}
      - run: golangci-lint run ./...
        working-directory: ${{ github.workspace }}

  integration:
    runs-on: docker
    container:
      image: golang:1.26
    services:
      alertmanager:
        # Keep in step with test/integration/docker-compose.yml.
        image: prom/alertmanager:v0.34.1
    steps:
      - run: git clone --quiet "http://x-access-token:${{ secrets.GITHUB_TOKEN }}@forgejo:3000/${{ github.repository }}.git" "$GITHUB_WORKSPACE" && git -C "$GITHUB_WORKSPACE" checkout --quiet ${{ github.sha }}
      - run: |
          for i in $(seq 1 30); do
            curl -sf http://alertmanager:9093/-/ready >/dev/null && exit 0
            sleep 1
          done
          echo "alertmanager service not ready" >&2; exit 1
      - run: go test -tags integration -count=1 -v ./test/integration/
        working-directory: ${{ github.workspace }}
        env:
          AMP_IT_UPSTREAM_URL: http://alertmanager:9093

  integration-v026:
    # Act runner shares one network between jobs; run after the target service
    # so the `alertmanager` service alias cannot resolve to the other version.
    needs: [integration]
    runs-on: docker
    container:
      image: golang:1.26
    services:
      alertmanager:
        # Keep in step with test/integration/docker-compose.yml.
        image: prom/alertmanager:v0.26.0
    steps:
      - run: git clone --quiet "http://x-access-token:${{ secrets.GITHUB_TOKEN }}@forgejo:3000/${{ github.repository }}.git" "$GITHUB_WORKSPACE" && git -C "$GITHUB_WORKSPACE" checkout --quiet ${{ github.sha }}
      - run: |
          for i in $(seq 1 30); do
            curl -sf http://alertmanager:9093/-/ready >/dev/null && exit 0
            sleep 1
          done
          echo "alertmanager service not ready" >&2; exit 1
      - run: go test -tags integration -count=1 -v ./test/integration/
        working-directory: ${{ github.workspace }}
        env:
          AMP_IT_UPSTREAM_URL: http://alertmanager:9093

  contract:
    # v1 contract harness (story 020) against proxy -> current Alertmanager.
    # Alertmanager needs test/contract/alertmanager.yml, which a job service
    # can't mount (services start before the clone), so the job runs the
    # release binary itself, checksum-verified. Keep AM_VERSION in step with
    # test/contract/docker-compose.yml.
    runs-on: docker
    container:
      image: golang:1.26
    env:
      AM_VERSION: 0.34.1
    steps:
      - run: git clone --quiet "http://x-access-token:${{ secrets.GITHUB_TOKEN }}@forgejo:3000/${{ github.repository }}.git" "$GITHUB_WORKSPACE" && git -C "$GITHUB_WORKSPACE" checkout --quiet ${{ github.sha }}
      - run: |
          cd /tmp
          base=https://github.com/prometheus/alertmanager/releases/download/v$AM_VERSION
          tarball=alertmanager-$AM_VERSION.linux-amd64.tar.gz
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/sha256sums.txt" | grep " $tarball\$" | sha256sum -c -
          tar xzf "$tarball"
      - run: |
          /tmp/alertmanager-$AM_VERSION.linux-amd64/alertmanager \
            --config.file=test/contract/alertmanager.yml --storage.path=/tmp/am-data \
            --web.listen-address=127.0.0.1:9093 > /tmp/alertmanager.log 2>&1 &
          go build -o /tmp/alertmanager-proxy ./cmd/alertmanager-proxy
          AMP_UPSTREAM_URL=http://127.0.0.1:9093 AMP_LISTEN_ADDRESS=127.0.0.1:9095 \
            AMP_ADMIN_LISTEN_ADDRESS=127.0.0.1:9096 /tmp/alertmanager-proxy > /tmp/proxy.log 2>&1 &
          go run ./test/contract/cmd/contract verify -strict -target http://127.0.0.1:9095 || {
            status=$?; echo "--- alertmanager.log"; tail -50 /tmp/alertmanager.log
            echo "--- proxy.log"; tail -50 /tmp/proxy.log; exit $status; }
        working-directory: ${{ github.workspace }}

  contract-v026:
    # v1 strict contract against the initial deployment version.
    # Alertmanager needs test/contract/alertmanager.yml, which a job service
    # can't mount (services start before the clone), so the job runs the
    # release binary itself, checksum-verified. Keep AM_VERSION in step with
    # test/contract/docker-compose.yml.
    runs-on: docker
    container:
      image: golang:1.26
    env:
      AM_VERSION: 0.26.0
    steps:
      - run: git clone --quiet "http://x-access-token:${{ secrets.GITHUB_TOKEN }}@forgejo:3000/${{ github.repository }}.git" "$GITHUB_WORKSPACE" && git -C "$GITHUB_WORKSPACE" checkout --quiet ${{ github.sha }}
      - run: |
          cd /tmp
          base=https://github.com/prometheus/alertmanager/releases/download/v$AM_VERSION
          tarball=alertmanager-$AM_VERSION.linux-amd64.tar.gz
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/sha256sums.txt" | grep " $tarball\$" | sha256sum -c -
          tar xzf "$tarball"
      - run: |
          /tmp/alertmanager-$AM_VERSION.linux-amd64/alertmanager \
            --config.file=test/contract/alertmanager.yml --storage.path=/tmp/am-data \
            --web.listen-address=127.0.0.1:9093 > /tmp/alertmanager.log 2>&1 &
          go build -o /tmp/alertmanager-proxy ./cmd/alertmanager-proxy
          AMP_UPSTREAM_URL=http://127.0.0.1:9093 AMP_LISTEN_ADDRESS=127.0.0.1:9095 \
            AMP_ADMIN_LISTEN_ADDRESS=127.0.0.1:9096 /tmp/alertmanager-proxy > /tmp/proxy.log 2>&1 &
          go run ./test/contract/cmd/contract verify -strict -target http://127.0.0.1:9095 || {
            status=$?; echo "--- alertmanager.log"; tail -50 /tmp/alertmanager.log
            echo "--- proxy.log"; tail -50 /tmp/proxy.log; exit $status; }
        working-directory: ${{ github.workspace }}

  docker-build:
    needs: [build-test, lint, integration, integration-v026, contract, contract-v026]
    runs-on: docker
    container:
      image: docker:27-cli
    steps:
      - run: apk add --no-cache git
      - run: git clone --quiet "http://x-access-token:${{ secrets.GITHUB_TOKEN }}@forgejo:3000/${{ github.repository }}.git" "$GITHUB_WORKSPACE" && git -C "$GITHUB_WORKSPACE" checkout --quiet ${{ github.sha }}
      - run: docker build --build-arg VERSION=${{ github.sha }} -t alertmanager-proxy:ci-${{ github.sha }} .
        working-directory: ${{ github.workspace }}
